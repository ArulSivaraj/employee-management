services:
  postgres:
    image: postgres:16
    container_name: employee-management-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: employee_management
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
